minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - "@vercel/agent-readability@0.5.1"

allowBuilds:
  "@mongodb-js/zstd": false
  "@parcel/watcher": false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  msw: false
  node-liblzma: false
  sharp: false

packages:
  - "packages/*"
  - "apps/*"
  - "tests/*"
  - "examples/*"

peerDependencyRules:
  allowedVersions:
    # vite-plus aliases `vite` to @voidzero-dev/vite-plus-core, whose 0.x
    # version never matches the upstream-Vite range that the bundled vitest
    # declares. Scoped to that pair so other vite peers stay checked.
    "vitest>vite": "*"
    "@vitest/mocker>vite": "*"
